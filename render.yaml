services:
  - type: web
    name: careerpilot-ai-service
    runtime: python
    plan: free
    branch: master
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: AI_SERVICE_INTERNAL_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: LOCAL_EMBEDDING_PROVIDER
        value: onnx
      - key: LOCAL_EMBEDDING_CACHE_DIR
        value: /tmp/careerpilot-ai/minilm-onnx

  - type: web
    name: careerpilot-backend
    runtime: node
    plan: free
    branch: master
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run db:generate && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.16.0
      - key: FRONTEND_URL
        sync: false
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: careerpilot-ai-service
          property: host
      - key: AI_SERVICE_INTERNAL_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_RESUME_BUCKET
        value: resumes
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: RESUME_MAX_SIZE_BYTES
        value: "10485760"
